
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJMIX REPLICA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
      
      body {
        margin: 0;
        padding: 0;
        background-color: #050505;
        color: #ffffff;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .font-orbitron {
        font-family: 'Orbitron', sans-serif;
      }

      .neon-border {
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.5);
        border: 1px solid rgba(0, 255, 255, 0.8);
      }

      /* RTX Visual Enhancements */
      .rtx-visual-mode {
        filter: contrast(1.1) saturate(1.2);
      }
      
      .rtx-visual-mode .game-field-container {
        backdrop-filter: blur(2px) brightness(1.1);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.98); }
      }

      .animate-pulse-fast {
        animation: pulse 0.5s infinite ease-in-out;
      }

      .animate-spin-slow {
        animation: spin 8s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* GPU Performance Tweak */
      * {
        backface-visibility: hidden;
        perspective: 1000;
      }
    </style>
